<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="assets/logo/favicon.ico?v=202603101125">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32x32.png?v=202603101125">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16x16.png?v=202603101125">
  <meta http-equiv="refresh" content="25;url=/" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
    <title>CyberCore | Hosting, Alojamento, VPS, Cloud, Servidores, Domínios, Certificados SSL</title>
  <style>
    :root {
      --bg: #2973EC;
      --card: rgba(255, 255, 255, 0.12);
      --line: rgba(255, 255, 255, 0.25);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.86);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .logo {
      height: 74px;
      width: auto;
      display: inline-block;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
    }

    p {
      margin: 0;
      font-size: 1.03rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .cta {
      margin-top: 18px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      font-weight: 600;
    }

    .cta:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .foot {
      margin-top: 16px;
      font-size: 0.92rem;
      color: rgba(255, 255, 255, 0.76);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-live="polite">
      <img class="logo" src="assets/logo/cc-branco.png" alt="CyberCore" />
      <h1>Estamos em manutenção</h1>
      <p>Estamos a realizar melhorias para regressar com um serviço ainda melhor. Voltamos em breve.</p>
      <a class="cta" href="/">Ir para o site</a>
      <p class="foot">Obrigado pela compreensão. Esta página tenta voltar ao site automaticamente.</p>
    </section>
  </main>

</body>
</html>
