<!doctype html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Confirmação de Email</title>
</head>
<body style="margin:0;padding:0;background:#f2f4f8;font-family:Arial, sans-serif;">
	<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f4f8;padding:18px 0;">
		<tr>
			<td align="center">
				<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e5e9f2;">
					<!-- Blue Line -->
					<tr>
						<td style="height:5px;background:#003d99;"></td>
					</tr>
					<!-- Header with Centered Logo -->
					<tr>
						<td align="center" style="background:#0033aa;padding:28px 32px;">
							<a href="https://www.cybercore.pt" style="text-decoration:none;display:inline-block;">
								<img src="https://manager.cybercore.pt/themes/logos/logos-09.png" alt="Cybercore" style="height:84px;display:block;" />
							</a>
						</td>
					</tr>
					<!-- Content -->
					<tr>
						<td style="padding:26px 28px;color:#111827;font-size:15px;line-height:1.7;">
							<h1 style="font-family:Arial, sans-serif;text-align:center;font-size:24px;font-weight:700;margin:0 0 20px;color:#111827;">Confirmação de Email</h1>

							<p style="margin:0 0 12px;">Estimado(a) {{ c.first_name }} {{ c.last_name }},</p>
							<p style="margin:0 0 12px;">Por favor, verifique seu email clicando no botão abaixo:</p>

							<div style="margin: 24px 0; text-align: center;">
								<a href="{{ email_confirmation_link }}" target="_blank" style="background:#003d99;color:#fff;text-decoration:none;padding:12px 28px;border-radius:6px;display:inline-block;font-weight:600;">Verificar endereço de email</a>
							</div>

							
						</td>
					</tr>
					<!-- Footer -->
					<tr>
						<td style="background:#f3f4f6;color:#6b7280;padding:12px 24px;font-size:12px;text-align:center;">
							Este email foi enviado automaticamente pela Cybercore.
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
